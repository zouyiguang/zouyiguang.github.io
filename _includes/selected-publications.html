<ol class="selected-publications">
  {% for paper in site.data.selected_publications %}
  <li>
    {{ paper.authors | escape }} ({{ paper.year }}).
    <a href="{{ paper.doi | escape }}">{{ paper.title | escape }}</a>.
    <em>{{ paper.journal | escape }}</em>, {{ paper.volume }}, {{ paper.article | escape }}.
  </li>
  {% endfor %}
</ol>
<p>For the full publication list, please see <a href="{{ site.author.googlescholar | escape }}">Google Scholar</a>.</p>
